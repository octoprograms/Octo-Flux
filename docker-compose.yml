services:
  octoflux:
    build:
      context: .
      dockerfile: Dockerfile
    image: octoflux:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
